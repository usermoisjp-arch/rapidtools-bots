name: Messages #general et annonces

# Toutes les heures ; chaque script décide s'il est l'heure de poster :
# promo.py dans #general (6 à 12 h d'écart, 13 h à 23 h UTC), announce.py dans #announcements (4 à 7 jours, 17 h à 20 h UTC)
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

# Même groupe que watch.yml : les deux sauvegardent dans le dépôt, jamais en même temps
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  # 1. Exécute les scripts (yt-dlp, code tiers) avec les secrets des webhooks, SANS droit d'écriture
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      # Actions officielles figées par SHA (un tag peut être déplacé, un SHA non)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Message #general si c'est l'heure
        env:
          DISCORD_PROMO_WEBHOOK_URL: ${{ secrets.DISCORD_PROMO_WEBHOOK_URL }}
          BANNED_IDS: ${{ vars.BANNED_IDS }}
        run: python promo.py
      - name: Annonce si c'est l'heure
        if: always()
        env:
          DISCORD_ANNOUNCE_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK_URL }}
          BANNED_IDS: ${{ vars.BANNED_IDS }}
        run: python announce.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: state
          path: |
            promo_state.json
            announce_state.json
          if-no-files-found: ignore
          retention-days: 1

  # 2. Sauvegarde l'état : droit d'écriture, mais aucun code tiers installé et aucun secret Discord
  save:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: state
          path: incoming
      - name: Sauvegarder l'état
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in promo_state.json announce_state.json; do
            [ -f "incoming/$f" ] || continue
            python3 -I -c 'import json,sys; json.load(open(sys.argv[1]))' "incoming/$f"
            cp "incoming/$f" "$f"
            git add "$f"
          done
          git config user.name "rapidtools-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "messages [skip ci]"
          git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
