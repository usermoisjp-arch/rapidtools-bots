name: XP et classement

# Toutes les 10 min : le bot (Vercel) compte l'XP des nouveaux messages, points.json est sauvegardé ici
on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: points
  cancel-in-progress: false

jobs:
  # 1. Appelle le bot avec CRON_SECRET (bibliothèque standard Python, aucun paquet installé), SANS droit d'écriture
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compter l'XP
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python3 -I points.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: points
          path: points.json
          retention-days: 1

  # 2. Sauvegarde : droit d'écriture, aucun secret
  save:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: points
          path: incoming
      - name: Sauvegarder points.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d["users"], dict)' incoming/points.json
          cp incoming/points.json points.json
          git config user.name "rapidtools-bot"
          git config user.email "actions@users.noreply.github.com"
          git add points.json
          git diff --cached --quiet && exit 0
          git commit -m "xp [skip ci]"
          git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
