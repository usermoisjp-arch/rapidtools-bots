name: TikTok -> Discord

# Toutes les 10 min (GitHub peut décaler un peu), + bouton "Run workflow"
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  # 1. Exécute yt-dlp (code tiers) avec le seul secret du webhook, SANS droit d'écriture sur le dépôt
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      # Actions officielles figées par SHA (un tag peut être déplacé, un SHA non)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chercher les nouvelles vidéos
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BANNED_IDS: ${{ vars.BANNED_IDS }}
        run: python watch.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: state
          path: state.json
          retention-days: 1

  # 2. Sauvegarde l'état : droit d'écriture, mais aucun code tiers installé et aucun secret Discord
  save:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: state
          path: incoming
      - name: Sauvegarder l'état
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f incoming/state.json ] || exit 0
          python3 -I -c 'import json,sys; json.load(open(sys.argv[1]))' incoming/state.json
          cp incoming/state.json state.json
          git config user.name "rapidtools-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "état [skip ci]"
          git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
